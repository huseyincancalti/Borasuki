[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borasuki"
version = "1.0.0b1"
description = "NVIDIA-first anime upscaling desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywebview>=6.2,<7", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["borasuki*"]

[tool.setuptools.package-data]
borasuki = ["locales/*.json", "*.vpy", "*.ps1"]
